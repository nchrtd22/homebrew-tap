name: Check casks
on:
  pull_request:
    paths:
      - "Casks/*.rb"
jobs:
  fetch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main 2026-11-06
      - name: Point the tap at the PR branch
        run: |
          TAP_DIR="$(brew --repository nchrtd22/tap)"
          git -C "$TAP_DIR" fetch origin "${{ github.event.pull_request.head.ref }}"
          git -C "$TAP_DIR" checkout --quiet FETCH_HEAD
          brew trust --tap nchrtd22/tap
      - name: Fetch changed casks (verifies URL + sha256)
        run: |
          for f in $(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'Casks/*.rb'); do
            cask=$(basename "$f" .rb)
            echo "::group::Fetching nchrtd22/tap/$cask"
            brew fetch --cask "nchrtd22/tap/$cask"
            echo "::endgroup::"
          done
