name: Bump casks
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main 2026-11-06
      - name: Tap and trust
        run: |
          brew tap nchrtd22/tap
          brew trust --tap nchrtd22/tap
      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main 2026-11-06
        with:
          username: ${{ github.actor }}
      - name: Bump outdated casks
        run: brew bump --no-fork --open-pr --casks --tap=nchrtd22/tap
      - name: Notify on new bump PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -u --date='15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          open_prs=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/nchrtd22/homebrew-tap/pulls?state=open&per_page=100")
          new_bumps=$(echo "$open_prs" | jq -r --arg since "$SINCE" \
            '.[] | select(.created_at >= $since) | select(.head.ref | startswith("bump-")) | .number')
          for pr in $new_bumps; do
            title=$(echo "$open_prs" | jq -r --argjson n "$pr" '.[] | select(.number == $n) | .title')
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"body\": \"@nchrtd22 Update available: ${title} — ready for review and merge.\"}" \
              "https://api.github.com/repos/nchrtd22/homebrew-tap/issues/${pr}/comments"
          done
